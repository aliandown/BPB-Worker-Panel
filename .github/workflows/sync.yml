name: Auto Sync Fork

on:
  schedule:
    # 每天 UTC 00:00 自动运行一次（可自定义 Cron 表达式）
    - cron: '0 0 * * 1'
  workflow_dispatch: # 允许手动点击触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        uses: a225121/sync-upstream-repo@v1.2.0
        with:
          upstream_repo: "https://github.com/bia-pain-bache/BPB-Worker-Panel.git"
          upstream_branch: "main"  # 上游仓库的主分支（如 main 或 master）
          target_branch: "main"    # 你的 Fork 仓库中需要同步的分支
          github_token: ${{ secrets.GITHUB_TOKEN }}
