name: Auto Sync Fork

on:
  schedule:
    # 每周日 UTC 00:00 自动运行一次
    - cron: '0 0 * * 1'
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/bia-pain-bache/BPB-Worker-Panel.git
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "Merge upstream changes"
          git push origin main
